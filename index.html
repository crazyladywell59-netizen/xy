<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>快捷跳转</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#f5f7fa;
            font-family:system-ui
        }
        .box{
            text-align:center
        }
        a{
            display:inline-block;
            padding:14px 40px;
            background:#2563eb;
            color:#fff;
            text-decoration:none;
            border-radius:8px;
            font-size:18px
        }
        a:hover{
            background:#1d4ed8
        }
    </style>
</head>
<body>
    <div class="box">
        <!-- 把引号内换成你想要跳转的目标网址 -->
        <a href="https://share.feijipan.com/s/U88VyybK" target="_blank">点击跳转</a>
    </div>
</body>
</html>
